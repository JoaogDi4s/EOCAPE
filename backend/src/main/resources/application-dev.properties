# Logs e SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.eocape=DEBUG

# Segurança (usuário fixo para testes)
spring.security.user.name=dev
spring.security.user.password=${DEV_PASSWORD:troque-essa-senha}

# E-mail (SMTP) - valores vêm do .env ou das variáveis de ambiente
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true