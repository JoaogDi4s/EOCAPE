<nav
  class="flex flex-row relative justify-between items-center bg-eocape-baby-blue text-eocape-dark-blue p-4 h-14"
>
  <div class="flex flex-row items-center gap-2">
    <img src="/images/logo.svg" alt="Logo EOCAPE" class="lg:h-8 lg:w-8 md:h-7 md:w-7 h-6 w-6" />
    <span class="lg:text-3xl md:text-2xl text-xl font-bold tracking-widest">
      <a href="#home">EOCAPE</a>
    </span>
  </div>

  <!-- Botão sanduíche: só aparece abaixo de 640px -->
  <div class="sm:hidden w-full flex flex-row justify-end">
    <button
      type="button"
      class="p-2 sm:hidden justify-self-end"
      aria-label="Abrir menu"
      [attr.aria-expanded]="menuAberto"
      (click)="menuAberto = !menuAberto"
    >
      <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        @if (!menuAberto) {
          <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" />
        } @else {
          <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" />
        }
      </svg>
    </button>
  </div>
  <!-- Menu: dropdown no mobile, linha normal a partir de sm -->
  <div
    class="absolute inset-x-0 top-full z-50 flex w-full flex-col bg-eocape-baby-blue shadow-lg transition-all duration-200 ease-out sm:hidden"
    [class.invisible]="!menuAberto"
    [class.pointer-events-none]="!menuAberto"
    [class.-translate-y-2]="!menuAberto"
    [class.translate-y-0]="menuAberto"
    [class.opacity-0]="!menuAberto"
    [class.opacity-100]="menuAberto"
    [attr.aria-hidden]="!menuAberto"
    [attr.inert]="menuAberto ? null : ''"
    (click)="menuAberto = false"
  >
    <ul
      class="flex flex-col divide-y divide-[#3F72AF]/15 text-lg font-semibold [&>li]:transition-colors [&>li>a]:flex [&>li>a]:min-h-12 [&>li>a]:w-full [&>li>a]:items-center [&>li>a]:px-5 [&>li>a]:py-3 [&>li>a]:transition-colors [&>li>a]:hover:bg-[#3F72AF]/10 [&>li>a]:active:bg-[#3F72AF]/20 [&>li>a]:focus-visible:bg-[#3F72AF]/10"
    >
      <li><a href="#home" (click)="$event.preventDefault(); irPara('home')">Home</a></li>

      <li><a href="#sobre" (click)="$event.preventDefault(); irPara('sobre')">Sobre</a></li>

      <li>
        <a href="#servicos" (click)="$event.preventDefault(); irPara('servicos')">Serviços</a>
      </li>

      <li><a href="#contato" (click)="$event.preventDefault(); irPara('contato')">Contato</a></li>
    </ul>
  </div>

  <div class="flex flex-row items-center lg:gap-18 gap-10">
    <ul
      class="font-bold hidden sm:flex lg:flex-row lg:text-2xl md:text-xl lg:gap-18 gap-10 [&>li]:transition-all [&>li]:hover:underline"
    >
      <li><a href="#home">Home</a></li>

      <li><a href="#sobre">Sobre</a></li>

      <li><a href="#servicos">Serviços</a></li>

      <li><a href="#contato">Contato</a></li>
    </ul>

    <app-button
      routerLink="/login"
      buttonClass="flex rounded-3xl px-4 py-1.5 font-bold text-lg w-24 h-8 justify-center items-center transition bg-eocape-light-blue text-eocape-baby-blue shadow-lg hover:scale-105"
    >
      Entrar
    </app-button>
  </div>
</nav>
