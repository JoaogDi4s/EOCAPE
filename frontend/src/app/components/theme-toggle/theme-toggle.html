<button
  type="button"
  class="theme-toggle"
  (click)="theme.toggle()"
  [attr.aria-pressed]="theme.isDark()"
  [attr.aria-label]="theme.isDark() ? 'Ativar modo claro' : 'Ativar modo escuro'"
  [title]="theme.isDark() ? 'Ativar modo claro' : 'Ativar modo escuro'"
>
  <svg
    aria-hidden="true"
    width="20"
    height="20"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    @if (theme.isDark()) {
      <circle cx="12" cy="12" r="4" />
      <path
        d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4L19 5"
      />
    } @else {
      <path d="M20.8 13a9 9 0 0 1-9.8-9.8A9 9 0 1 0 20.8 13Z" />
    }
  </svg>
  <span class="theme-label">{{ theme.isDark() ? 'Modo claro' : 'Modo escuro' }}</span>
</button>
