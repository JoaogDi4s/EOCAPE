<section
  class="grid w-full grid-cols-1 gap-12 bg-eocape-baby-blue bg-cover bg-bottom bg-no-repeat px-6 py-24 text-center text-eocape-white md:grid-cols-2 md:py-36 lg:px-30"
  [style.background-image]="'url(/images/hero/hero_background.png)'"
>
  <div class="flex flex-col items-center justify-center gap-6 md:items-start md:text-left">
    <h1 class="text-4xl font-bold tracking-widest md:text-6xl">
      A vida em condomínio mais conectada
    </h1>
    <p class="mt-6 max-w-xl text-xl md:text-2xl">
      EOCAPE une moradores, síndicos e portaria em uma única plataforma, clara e acesso facilitado
      para todos.
    </p>

    <div class="mt-10">
      <app-button (clicked)="irParaLogin()">Comece agora</app-button>
    </div>
  </div>
  <div class="flex flex-col items-center gap-4">
    <!-- Área do carrossel -->
    <div
      class="w-full max-w-md overflow-hidden py-2 [--gap:1rem] [--d:1] [--card:calc((100%-(var(--d)-1)*var(--gap))/var(--d))] [--span:calc(var(--d)*var(--card)+(var(--d)-1)*var(--gap))] [--step:calc(var(--card)+var(--gap))] md:[--d:2]"
      [style.--d]="destaques()"
    >
      <div
        class="flex gap-(--gap) pl-[calc(50%-var(--span)/2)] transition-transform duration-500 ease-in-out transform-[translateX(calc(var(--step)*var(--i)*-1))]"
        [style.--i]="indiceAtual()"
      >
        @for (slide of slides; track slide.src; let i = $index) {
          <div
            class="aspect-square w-(--card) flex-none overflow-hidden rounded-[2.5rem] p-6 transition-all duration-500"
            [class.-translate-y-2]="destacado(i)"
            [class.translate-y-2]="!destacado(i)"
            [class.opacity-50]="!destacado(i)"
            [attr.aria-hidden]="!destacado(i)"
          >
            <img [src]="slide.src" [alt]="slide.alt" class="h-full w-full object-contain" />
          </div>
        }
      </div>
    </div>

    <!-- Bolinhas -->
    <div class="flex gap-2" role="tablist" aria-label="Escolher imagem">
      @for (slide of slides; track slide.src; let i = $index) {
        <button
          type="button"
          role="tab"
          (click)="irParaSlide(i)"
          [attr.aria-selected]="destacado(i)"
          [attr.aria-label]="'Ir para imagem ' + (i + 1)"
          class="h-3 w-3 cursor-pointer rounded-full border-2 border-eocape-white transition-colors"
          [class.bg-eocape-white]="destacado(i)"
        ></button>
      }
    </div>
  </div>
</section>
