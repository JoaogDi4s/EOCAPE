<div
  class="flex flex-1 flex-col items-center justify-center gap-8 py-16 text-eocape-dark-blue lg:px-[120px]"
>
  <!-- Título -->
  <div class="flex flex-row self-start">
    <div class="w-full max-w-[52.5rem] px-6">
      <h2 class="text-3xl font-bold md:text-4xl">
        Tudo que seu condomínio precisa, em um só lugar.
      </h2>
      <p class="mt-2 max-w-xl text-xl">
        Simplifique a rotina de moradores, síndicos e portaria com ferramentas pensadas para o dia a
        dia.
      </p>
    </div>
  </div>

  <!-- Carrossel -->
  <div
    class="w-full overflow-hidden py-10 md:max-w-[52.5rem] lg:max-w-none [--card:16rem] [--gap:1rem] [--d:1] md:[--card:18rem] md:[--gap:1.5rem] md:[--d:2] [--span:calc(var(--d)_*_var(--card)_+_(var(--d)_-_1)_*_var(--gap))] [--step:calc(var(--card)_+_var(--gap))]"
  >
    <div
      class="flex gap-[var(--gap)] pl-[calc(50%_-_var(--span)_/_2)] transition-transform duration-500 ease-in-out"
      [style.transform]="'translateX(calc(var(--step) * ' + -indiceAtual() + '))'"
    >
      @for (card of cards; track card.titulo; let i = $index) {
        <article
          class="flex w-[var(--card)] flex-none flex-col items-center gap-4 rounded-[2.5rem] bg-eocape-light-blue px-8 pb-10 pt-8 text-center text-eocape-white transition-all duration-500"
          [class.-translate-y-6]="destacado(i)"
          [class.translate-y-6]="!destacado(i)"
          [class.opacity-50]="!destacado(i)"
        >
          <!-- Espaço da imagem: troque esta div por um <img> depois -->
          <div class="aspect-square w-full rounded-3xl bg-eocape-white"></div>

          <h3 class="text-xl font-bold">{{ card.titulo }}</h3>
          <p>{{ card.texto }}</p>
        </article>
      }
    </div>
  </div>

  <!-- Bolinhas -->
  <div class="flex gap-2" role="tablist" aria-label="Navegar pelos benefícios">
    @for (p of posicoes(); track p) {
      <button
        type="button"
        role="tab"
        (click)="irParaPosicao(p)"
        [attr.aria-selected]="p === indiceAtual()"
        [attr.aria-label]="'Ir para a posição ' + (p + 1)"
        class="h-3 w-3 cursor-pointer rounded-full border-2 border-eocape-blue transition-colors"
        [class.bg-eocape-blue]="p === indiceAtual()"
      ></button>
    }
  </div>
</div>
